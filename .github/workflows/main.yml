name: Deploy React App to GitHub Pages

on:
  push:
    branches: ["main"] # O "master", in base al nome del tuo branch principale

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Installazione dipendenze
        run: npm install

      - name: Build del progetto React
        run: npm run build

      - name: Caricamento artifact per Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Se usi Vite la cartella è "dist", se usi Create React App cambia in "build"
          path: "./dist"

      - name: Deployment su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
